<app-page-header title="انضم لفريق المدربين" subtitle="تسجيل المدربين والخبراء الأكاديميين المتعاونين مع العمادة." />

<section class="py-10">
  <div class="container-page grid gap-10 lg:grid-cols-12">
    <div class="rounded-lg bg-white p-7 shadow-card md:p-9 lg:col-span-7">
      <h2 class="text-2xl font-bold">تسجيل المدربين والخبراء الأكاديميين</h2>
      <p class="mt-2 mb-6 text-muted">أدخل بياناتك وسيتواصل معك فريق العمادة لاستكمال إجراءات التسجيل.</p>
      <app-request-form [fields]="fields" submitLabel="تسجيل" successMessage="تم استلام طلب التسجيل، وسنتواصل معك قريباً." />
    </div>

    <aside class="lg:col-span-5">
      <h2 class="text-xl font-bold">الوثائق والنماذج</h2>
      <ul class="mt-6 space-y-4">
        @for (d of documents; track d.file) {
          <li>
            <a [href]="d.file" target="_blank" class="flex items-center justify-between gap-4 rounded-md bg-tint p-5 font-semibold transition hover:bg-accent-soft">
              {{ d.title }}
              <app-icon name="download" class="text-accent" />
            </a>
          </li>
        }
      </ul>
    </aside>
  </div>
</section>
