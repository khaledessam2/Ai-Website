<section id="contact" class="bg-tint py-12 md:py-14">
  <div class="container-page grid gap-8 lg:grid-cols-12">
    <div class="rounded-lg bg-white p-8 shadow-card md:p-10 lg:col-span-7">
      <span class="eyebrow">تواصل معنا</span>
      <h2 class="mt-4 text-3xl font-bold md:text-4xl">نحن هنا لمساعدتك</h2>
      <p class="mt-3 text-muted">تواصل معنا للحصول على المعلومات والدعم الذي تحتاجه.</p>

      @if (sent()) {
        <p class="mt-6 rounded-md bg-accent-soft px-5 py-4 font-medium text-accent-hover" role="status">
          شكراً لك، تم استلام رسالتك وسنتواصل معك قريباً.
        </p>
      }

      <form class="mt-8 grid gap-5 sm:grid-cols-2" (submit)="submit($event)">
        <label class="grid gap-2 text-sm font-semibold">
          <span>الاسم <span class="text-accent">*</span></span>
          <input name="name" required autocomplete="name" placeholder="أدخل اسمك" class="rounded-sm border border-line bg-tint/50 px-4 py-3 font-normal outline-none focus:border-accent" />
        </label>
        <label class="grid gap-2 text-sm font-semibold">
          <span>الهاتف المحمول <span class="text-accent">*</span></span>
          <input name="phone" type="tel" required autocomplete="tel" dir="auto" placeholder="أدخل رقم هاتفك المحمول" class="rounded-sm border border-line bg-tint/50 px-4 py-3 font-normal outline-none focus:border-accent" />
        </label>
        <label class="grid gap-2 text-sm font-semibold">
          <span>البريد الإلكتروني <span class="text-accent">*</span></span>
          <input name="email" type="email" required autocomplete="email" dir="auto" placeholder="أدخل بريدك الإلكتروني" class="rounded-sm border border-line bg-tint/50 px-4 py-3 font-normal outline-none focus:border-accent" />
        </label>
        <label class="grid gap-2 text-sm font-semibold">
          <span>الجهة / الكلية</span>
          <input name="organization" autocomplete="organization" placeholder="أدخل اسم جهتك أو كليتك" class="rounded-sm border border-line bg-tint/50 px-4 py-3 font-normal outline-none focus:border-accent" />
        </label>
        <label class="grid gap-2 text-sm font-semibold sm:col-span-2">
          <span>الرسالة</span>
          <textarea name="message" rows="5" placeholder="اكتب رسالتك..." class="rounded-sm border border-line bg-tint/50 px-4 py-3 font-normal outline-none focus:border-accent"></textarea>
        </label>
        <button type="submit" class="btn-primary sm:col-span-2">إرسال الطلب</button>
      </form>
    </div>

    <aside class="surface-dark rounded-lg p-8 text-white shadow-card md:p-10 lg:col-span-5" aria-label="مركز العناية بالمستفيدين">
      <h3 class="text-2xl font-bold">مركز العناية بالمستفيدين</h3>
      <ul class="mt-8 space-y-4">
        @for (d of details; track d.label) {
          <li class="flex items-center gap-4 rounded-md border border-white/10 bg-white/[0.04] p-4">
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-sm bg-white/10"><app-icon [name]="d.icon" [size]="20" /></span>
            <div>
              <p class="text-sm text-white/70">{{ d.label }}</p>
              <p class="mt-0.5 font-semibold" [attr.dir]="d.ltr ? 'ltr' : null">{{ d.value }}</p>
            </div>
          </li>
        }
      </ul>
    </aside>
  </div>
</section>
