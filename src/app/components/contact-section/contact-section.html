<section id="contact" class="bg-tint py-12 md:py-14">
  <div class="container-page">
    <div class="mx-auto max-w-6xl overflow-hidden rounded-lg bg-white shadow-card">
      <h2 class="bg-accent px-6 py-6 text-center text-xl font-bold text-white">مركز العناية بالمستفيدين</h2>
      <div class="overflow-x-auto p-6">
        <table class="w-full border-collapse text-center">
          <thead>
            <tr>
              @for (d of details; track d.label) {
                <th scope="col" class="border border-line bg-tint px-5 py-4 font-bold">{{ d.label }}</th>
              }
            </tr>
          </thead>
          <tbody>
            <tr>
              @for (d of details; track d.label) {
                <td class="border border-line px-5 py-4">
                  <span class="inline-flex items-center gap-2" [attr.dir]="d.ltr ? 'ltr' : null">
                    @if (d.ltr) {
                      <span class="material-symbols-outlined text-accent" aria-hidden="true" style="font-size: 18px">call</span>
                    }
                    {{ d.value }}
                  </span>
                </td>
              }
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
