<section id="about" class="py-12 md:py-14">
  <div class="container-page">
    <app-section-heading
      eyebrow="عن العمادة"
      title="نبذة عن عمادة تطوير المهارات"
      description="نقدّم برامج ودورات تدريبية متميزة ودراسات تطويرية لمنسوبي جامعة الملك سعود من أعضاء هيئة التدريس والموظفين والطلاب."
    >
      <a routerLink="/about" class="btn-primary">
        اعرف المزيد
        <app-icon name="arrow-left" [size]="16" />
      </a>
    </app-section-heading>

    <ul class="mt-8 grid gap-5 lg:grid-cols-3">
      @for (p of pillars; track p.title) {
        <li class="rounded-md border-e-4 border-brand bg-white p-6 shadow-card">
          <div class="flex items-center gap-4">
            <span class="grid h-12 w-12 place-items-center rounded-md bg-accent-soft text-accent"><app-icon [name]="p.icon" [size]="24" /></span>
            <h3 class="text-xl font-bold">{{ p.title }}</h3>
          </div>
          <p class="mt-4 leading-8 text-muted">{{ p.text }}</p>
        </li>
      }
    </ul>

    <h3 class="mt-16 text-2xl font-bold">أهداف العمادة</h3>
    <ul class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-4">
      @for (o of objectives; track o.title; let i = $index) {
        <li class="rounded-md bg-tint p-6">
          <span class="text-sm font-semibold text-accent tabular-nums" dir="ltr">{{ (i + 1).toString().padStart(2, '0') }}</span>
          <h4 class="mt-2 font-bold">{{ o.title }}</h4>
          <p class="mt-2 text-sm leading-7 text-muted">{{ o.text }}</p>
        </li>
      }
    </ul>
  </div>
</section>
