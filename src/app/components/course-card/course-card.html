<article class="group flex h-full flex-col overflow-hidden rounded-md bg-white text-ink shadow-card transition duration-200 hover:-translate-y-1 hover:shadow-hover">
  <img [src]="course().image" [alt]="course().category" width="480" height="320" loading="lazy" class="aspect-[16/9] w-full object-cover" />

  <div class="flex flex-1 flex-col p-4">
    <h3 class="line-clamp-2 text-base leading-snug font-bold">{{ course().title }}</h3>

    <ul class="mt-3 space-y-1.5 text-sm text-muted">
      <li class="flex items-center gap-2.5"><app-icon name="calendar" [size]="16" />{{ course().date | arabicDate }}</li>
      <li class="flex items-center gap-2.5"><app-icon name="book" [size]="16" />{{ course().category }}</li>
      <li class="flex items-center gap-2.5"><app-icon name="user" [size]="16" />{{ course().audienceNote }}</li>
      <li class="flex items-start gap-2.5"><app-icon name="map-pin" [size]="16" class="mt-0.5" /><span class="line-clamp-2">{{ course().location }}</span></li>
    </ul>

    <a [routerLink]="['/courses', course().id]" class="mt-auto inline-flex items-center gap-2 pt-3 text-sm font-semibold text-accent group-hover:text-accent-hover">
      التفاصيل والتسجيل
      <app-icon name="arrow-left" [size]="16" />
    </a>
  </div>
</article>
