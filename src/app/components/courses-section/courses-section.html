<section id="courses" class="bg-white py-12 md:py-14">
  <div class="container-page">
    <app-section-heading
      eyebrow="الدورات التدريبية"
      title="أحدث دوراتنا"
      description="دورات وورش تدريبية في التقنية والجودة والقيادة والبحث والابتكار، تُقدَّم حضورياً وعن بعد."
      [dark]="false"
    />

    <div class="mt-6 flex flex-wrap gap-3" role="tablist" aria-label="الفئة المستهدفة">
      @for (f of filters(); track f.id) {
        <button
          type="button"
          role="tab"
          class="rounded-sm border px-5 py-2.5 text-sm font-semibold transition"
          [class]="selected() === f.id ? 'border-accent bg-accent text-white shadow-glow' : 'border-line bg-tint text-ink hover:border-accent'"
          [attr.aria-selected]="selected() === f.id"
          (click)="select(f.id)"
        >
          {{ f.name }}
        </button>
      }
    </div>

    <div class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-4">
      @for (course of pager.visible(); track course.id) {
        <app-course-card [course]="course" />
      } @empty {
        <p class="col-span-full py-12 text-center text-muted">{{ coursesService.loading() ? "جارٍ تحميل الدورات..." : coursesService.failed() ? "تعذّر تحميل الدورات حالياً." : "لا توجد دورات متاحة لهذه الفئة حالياً." }}</p>
      }
    </div>

    <div class="mt-6 grid items-center gap-6 sm:grid-cols-3">
      <div class="sm:col-start-1 sm:row-start-1 sm:justify-self-end">
        <app-carousel-controls [canPrev]="pager.canPrev()" [canNext]="pager.canNext()" (prev)="pager.prev()" (next)="pager.next()" />
      </div>
      <a routerLink="/courses" class="btn-primary justify-self-center sm:col-start-2 sm:row-start-1">
        عرض المزيد
        <span class="material-symbols-outlined" aria-hidden="true" style="font-size: 16px">arrow_back</span>
      </a>
    </div>
  </div>
</section>
