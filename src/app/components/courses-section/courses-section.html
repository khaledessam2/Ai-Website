<section id="courses" class="surface-dark py-12 md:py-14">
  <div class="container-page">
    <app-section-heading
      eyebrow="الدورات التدريبية"
      title="أحدث دوراتنا"
      description="دورات وورش تدريبية في التقنية والجودة والقيادة والبحث والابتكار، تُقدَّم حضورياً وعن بعد."
      [dark]="true"
    />

    <div class="mt-6 flex flex-wrap gap-3" role="tablist" aria-label="الفئة المستهدفة">
      @for (f of filters; track f.key) {
        <button
          type="button"
          role="tab"
          class="rounded-sm border px-5 py-2.5 text-sm font-semibold text-white transition"
          [class]="selected() === f.key ? 'border-accent bg-accent shadow-glow' : 'border-white/20 bg-white/10 hover:border-white/50'"
          [attr.aria-selected]="selected() === f.key"
          (click)="select(f.key)"
        >
          {{ f.label }}
        </button>
      }
    </div>

    <div class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-4">
      @for (course of pager.visible(); track course.id) {
        <app-course-card [course]="course" />
      } @empty {
        <p class="col-span-full py-12 text-center text-white/70">لا توجد دورات متاحة لهذه الفئة حالياً.</p>
      }
    </div>

    <div class="mt-6 grid items-center gap-6 sm:grid-cols-3">
      <div class="sm:col-start-1 sm:row-start-1 sm:justify-self-end">
        <app-carousel-controls [canPrev]="pager.canPrev()" [canNext]="pager.canNext()" (prev)="pager.prev()" (next)="pager.next()" />
      </div>
      <a routerLink="/courses" class="btn-primary justify-self-center sm:col-start-2 sm:row-start-1">
        عرض المزيد
        <app-icon name="arrow-left" [size]="16" />
      </a>
    </div>
  </div>
</section>
