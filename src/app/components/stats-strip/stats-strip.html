<section class="mt-12" aria-label="إحصائيات العمادة">
  <div class="container-page">
    <dl class="grid grid-cols-2 gap-px overflow-hidden rounded-lg bg-line shadow-card lg:grid-cols-4">
      @for (stat of stats; track stat.label) {
        <div class="flex flex-col items-center bg-white px-5 py-8 text-center">
          <span class="material-symbols-outlined text-accent" aria-hidden="true" style="font-size: 48px">{{ stat.icon }}</span>
          <dd class="mt-4 text-3xl font-bold text-navy-900 tabular-nums md:text-4xl" dir="ltr">{{ stat.value * progress() | number: '1.0-0' }}<span class="text-teal">+</span></dd>
          <dt class="mt-2 text-sm text-muted">{{ stat.label }}</dt>
        </div>
      }
    </dl>
  </div>
</section>
