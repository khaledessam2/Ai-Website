<section id="initiatives" class="py-12 md:py-14">
  <div class="container-page">
    <app-section-heading
      eyebrow="المبادرات"
      title="مبادرات نوعية تبني القدرات"
      description="مسارات تأهيلية متخصصة تستهدف تطوير القيادات وتأهيل المدربين وإعداد الكوادر داخل الجامعة."
    />

    <div class="mt-8 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
      @for (item of pager.visible(); track item.id) {
        <article class="flex flex-col overflow-hidden rounded-md bg-white shadow-card transition duration-200 hover:-translate-y-1 hover:shadow-hover">
          <img [src]="item.image" [alt]="item.title" width="500" height="60" loading="lazy" class="w-full" />
          <div class="flex flex-1 flex-col p-6">
            <h3 class="text-xl font-bold">{{ item.title }}</h3>
            <p class="mt-3 line-clamp-4 leading-7 text-muted">{{ item.goal }}</p>
            <div class="mt-auto pt-6">
              <a [routerLink]="['/initiatives', item.id]" class="btn-dark w-full">
                أعرف المزيد
                <app-icon name="arrow-left" [size]="16" />
              </a>
            </div>
          </div>
        </article>
      }
    </div>

    <div class="mt-8">
      <app-carousel-controls [canPrev]="pager.canPrev()" [canNext]="pager.canNext()" (prev)="pager.prev()" (next)="pager.next()" />
    </div>
  </div>
</section>
