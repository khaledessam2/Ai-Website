<section id="news" class="bg-tint py-12 md:py-14">
  <div class="container-page">
    <app-section-heading eyebrow="المركز الإعلامي" title="آخر الأخبار">
      <a routerLink="/news" class="btn-primary">
        جميع الأخبار
        <app-icon name="arrow-left" [size]="16" />
      </a>
    </app-section-heading>

    <div class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (item of news(); track item.id) {
        <article class="flex flex-col overflow-hidden rounded-md bg-white shadow-card transition duration-200 hover:-translate-y-1 hover:shadow-hover">
          <img [src]="item.image" alt="" width="380" height="200" loading="lazy" class="aspect-[19/10] w-full object-cover" />
          <div class="flex flex-1 flex-col p-5">
            <h3 class="line-clamp-3 text-base leading-snug font-bold">{{ item.title }}</h3>
            <p class="mt-3 line-clamp-3 text-sm leading-7 text-muted">{{ item.excerpt }}</p>
            <time class="mt-4 text-xs text-muted" [attr.datetime]="item.date">{{ item.date | arabicDate }}</time>
            <a [routerLink]="['/news', item.id]" class="mt-auto inline-flex items-center gap-2 pt-4 text-sm font-semibold text-accent hover:text-accent-hover">
              اقرأ المزيد
              <app-icon name="arrow-left" [size]="16" />
            </a>
          </div>
        </article>
      }
    </div>
  </div>
</section>
