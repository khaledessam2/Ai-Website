<footer class="surface-dark text-white/75">
  <div class="brand-stripe h-1"></div>
  <div class="container-page grid gap-12 py-16 md:grid-cols-2 lg:grid-cols-12">
    <div class="lg:col-span-4">
      <img src="images/logo.png" alt="جامعة الملك سعود" width="150" height="55" class="w-36 rounded-sm" />
      <p class="mt-4 text-lg font-bold text-white">{{ site.info.name }}</p>
      <p class="mt-3 max-w-sm leading-8">{{ site.info.vision }}</p>
    </div>

    @for (group of site.footerGroups; track group.title) {
      <nav class="lg:col-span-2 lg:first:col-start-6" [attr.aria-label]="group.title">
        <h3 class="font-bold text-white">{{ group.title }}</h3>
        <ul class="mt-5 space-y-3 text-sm">
          @for (link of group.links; track link.label) {
            <li><a [routerLink]="link.route" class="transition-colors hover:text-white">{{ link.label }}</a></li>
          }
        </ul>
      </nav>
    } 
  </div>

  <div class="border-t border-white/10">
    <div class="container-page flex flex-wrap items-center justify-between gap-4 py-6 text-sm">
      <div>
        <p>{{ site.info.credit }}</p>
        <p class="mt-1 text-white/55">تاريخ آخر تعديل: {{ site.info.lastUpdated }}</p>
      </div>
      <button type="button" (click)="scrollTop()" class="inline-flex items-center gap-2 hover:text-white">
        العودة للأعلى
        <app-icon name="arrow-up" [size]="14" />
      </button>
    </div>
  </div>
</footer>
